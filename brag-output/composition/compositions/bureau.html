  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const RMS = [0.838, 0.874, 0.898, 0.879, 0.851, 0.8, 0.827, 0.779, 0.884, 0.88, 0.868, 0.848, 0.786, 0.777, 0.751, 0.736, 0.657, 0.718, 0.796, 0.821, 0.819, 0.731, 0.701, 0.628, 0.625, 0.577, 0.661, 0.701, 0.67, 0.702, 0.682, 0.659, 0.587, 0.566, 0.499, 0.568, 0.61, 0.626, 0.669, 0.64, 0.762, 0.788, 0.783, 0.764, 0.747, 0.739, 0.772, 0.868, 0.856, 0.831, 0.783, 0.791, 0.736, 0.725, 0.685, 0.658, 0.701, 0.675, 0.739, 0.722, 0.74, 0.699, 0.708, 0.667, 0.692, 0.807, 0.832]; // musique, 1 valeur toutes les 2 images à partir de 19,0 s (temps du film)
      const OFFSET = 9.6; // début de cette scène dans le film

      // --- État initial ---
      gsap.set("#bu-ground-light", { opacity: 0 });
      gsap.set("#bu-sun", { opacity: 0, y: 420 });
      gsap.set("#bu-sun-halo", { opacity: 0 });
      gsap.set("#bu-carte-wrap", { opacity: 0, y: 80 });
      gsap.set("#bu-carte", { clipPath: "inset(0px 0px 0px 0px round 28px)" });
      gsap.set(["#bu-etat-b", "#bu-etat-c"], { opacity: 0 });
      gsap.set("#bu-cursor", { opacity: 0, x: 1720, y: 1010 });
      gsap.set("#bu-pastille", { opacity: 0, scale: 0.3 });
      gsap.set(".bu-line", { scaleX: 0 });
      gsap.set("#bu-hook .w", { opacity: 0, filter: "blur(8px)" });
      gsap.set("#bu-message .w", { opacity: 0, filter: "blur(6px)" });

      // --- Scène 1 : le fond sombre se pose sur la fin de l'intro ---
      tl.fromTo("#bu-scene", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);

      // Saisie dans le document (frappes douces calées sur ces départs)
      tl.to("#bu-l1", { scaleX: 1, duration: 0.38, ease: "power1.out" }, 0.6);
      tl.to("#bu-l2", { scaleX: 1, duration: 0.28, ease: "none" }, 1.0);
      tl.to("#bu-l3", { scaleX: 1, duration: 0.28, ease: "none" }, 1.28);
      tl.to("#bu-l4", { scaleX: 1, duration: 0.3, ease: "none" }, 1.56);
      tl.to("#bu-l5", { scaleX: 1, duration: 0.3, ease: "none" }, 1.88);
      tl.to("#bu-l6", { scaleX: 1, duration: 0.25, ease: "none" }, 2.2);
      tl.to("#bu-doc", { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 0.7);

      // Accroche : la signature, mot à mot. beat-locked: 10.54s (film)
      tl.to("#bu-hook .w", { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.08 }, 0.94);
      tl.to("#bu-hook .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in", stagger: 0.05 }, 3.5);

      // Pastille « bientôt » sur l'icône. beat-grid: 11.64s (film)
      tl.to("#bu-pastille", { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out" }, 2.04);

      // --- Scène 2 : la notification monte. beat-grid: 13.64s (film) ---
      tl.to("#bu-carte-wrap", { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 4.02);
      tl.to("#bu-doc", { opacity: 0.4, duration: 0.6, ease: "power2.out" }, 4.02);
      // La bulle de l'icône monte doucement puis s'efface (pause proposée)
      tl.to("#bu-tray-bulle", { y: -3, opacity: 0, duration: 0.8, ease: "power2.out" }, 4.1);

      // Curseur vers « Faire la pause (30 s) »
      // d'abord un passage sur « Une autre idée », puis vers le bouton
      tl.to("#bu-cursor", { opacity: 1, duration: 0.2, ease: "power1.out" }, 6.9);
      tl.to("#bu-cursor", { x: 1180, y: 652, duration: 0.75, ease: "power2.inOut" }, 6.95);
      tl.to("#bu-cursor", { x: 1436, y: 772, duration: 0.75, ease: "power2.inOut" }, 8.0);
      // Clic. beat-locked: 18.55s (film)
      tl.to("#bu-cursor", { scale: 0.86, duration: 0.07, ease: "power2.in" }, 8.95);
      tl.to("#bu-cursor", { scale: 1, duration: 0.15, ease: "power2.out" }, 9.02);
      tl.to("#bu-guide", { scale: 0.97, duration: 0.07, ease: "power2.in" }, 8.95);
      tl.to("#bu-guide", { scale: 1, duration: 0.15, ease: "power2.out" }, 9.02);

      // --- Scène 3 : la carte devient la pause guidée ---
      tl.to("#bu-etat-a", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 9.15);
      tl.to("#bu-carte", { clipPath: "inset(152px 0px 0px 0px round 28px)", duration: 0.4, ease: "power3.inOut" }, 9.15);
      tl.fromTo("#bu-etat-b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, 9.3);
      tl.to("#bu-cursor", { opacity: 0, duration: 0.3, ease: "power1.in" }, 9.2);

      // Anneau de 30 s, en accéléré
      const DEBUT = 9.55;
      const DUREE = 1.95;
      tl.to("#bu-progression", { attr: { "stroke-dashoffset": 0 }, duration: DUREE, ease: "none" }, DEBUT);
      for (let k = 1; k < 30; k++) {
        tl.set("#bu-reste", { textContent: 30 - k + " s" }, DEBUT + (k * DUREE) / 29);
      }

      // Le jour se lève : fond, soleil et couleurs de la carte passent au thème clair
      tl.to("#bu-ground-light", { opacity: 1, duration: 2.0, ease: "power2.inOut" }, 9.7);
      tl.to("#bu-sun", { opacity: 1, y: 0, duration: 2.4, ease: "power2.out" }, 9.6);
      tl.to(
        "#bu-scene",
        {
          "--f1": "#fdf1e7",
          "--f2": "#f9e6e4",
          "--f3": "#ece6f3",
          "--texte": "#2e2a3f",
          "--texte2": "#5f5a73",
          "--action": "#0e6f6a",
          "--sur-action": "#ffffff",
          "--picto-bg": "#fde3d2",
          "--lisere": "rgba(255, 255, 255, 0.7)",
          "--carte": "rgba(255, 255, 255, 0.62)",
          "--trace": "#f0d9cc",
          "--doc-bg": "rgba(255, 255, 255, 0.45)",
          "--doc-line": "rgba(239, 217, 204, 1)",
          "--doc-border": "rgba(255, 255, 255, 0.7)",
          duration: 1.6,
          ease: "power2.inOut",
        },
        9.8,
      );

      // Halo du soleil qui respire avec la musique (réaction audio discrète)
      for (let i = 0; i < RMS.length; i++) {
        const t = 19.0 + (i * 2) / 30 - OFFSET;
        if (t < 9.6) continue;
        tl.set("#bu-sun-halo", { opacity: Math.min(1, 0.25 + RMS[i] * 0.85) }, t);
      }

      // Anneau complet → message de fin (beat-grid: 21.29s film, au plus près)
      tl.to("#bu-etat-b", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 11.55);
      tl.to("#bu-carte", { clipPath: "inset(508px 0px 0px 0px round 28px)", duration: 0.4, ease: "power3.inOut" }, 11.55);
      tl.set("#bu-etat-c", { opacity: 1 }, 11.6);
      tl.to("#bu-message .w", { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.07 }, 11.65);
      tl.to("#bu-pastille", { opacity: 0, scale: 0.3, duration: 0.25, ease: "power2.in" }, 11.6);
      tl.fromTo("#bu-tray-bulle", { y: 3, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 11.7);

      window.__timelines["bureau"] = tl;
    })();
  </script>
