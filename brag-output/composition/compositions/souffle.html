  <div id="root" data-composition-id="souffle" data-width="1920" data-height="1080">
    <div id="so-scene">
      <div id="so-ground"></div>
      <h1 id="so-titre"><span class="w">Un</span><span class="w">moment</span><span class="w">pour</span><span class="w">souffler</span></h1>
      <div id="so-bulle" data-layout-ignore>
        <div id="so-halo-glow"></div>

        <div id="so-coeur"></div>
      </div>
      <div id="so-temps">
        <span id="so-p1" class="so-pilule">Inspire</span>
        <span id="so-p2" class="so-pilule">Garde</span>
        <span id="so-p3" class="so-pilule">Souffle</span>
        <span id="so-p4" class="so-pilule">Pause</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const RMS = [0.722, 0.74, 0.699, 0.708, 0.667, 0.692, 0.807, 0.832, 0.849, 0.789, 0.76, 0.694, 0.685, 0.684, 0.696, 0.788, 0.778, 0.819, 0.785, 0.86, 0.865, 0.907, 0.908, 0.903, 0.909, 0.829, 0.766, 0.637, 0.727, 0.729, 0.784, 0.796, 0.808, 0.828, 0.772, 0.753, 0.659, 0.727, 0.721, 0.742, 0.729, 0.741, 0.761, 0.683, 0.664, 0.582, 0.709, 0.738, 0.783, 0.785, 0.801, 0.798, 0.707, 0.763, 0.757, 0.818, 0.792, 0.817, 0.79, 0.775, 0.777, 0.734, 0.755, 0.706, 0.702, 0.657, 0.746, 0.798, 0.84, 0.867, 0.822, 0.748]; // 1 valeur toutes les 2 images à partir de 22,93 s (temps du film)
      const ACTIF = { backgroundColor: "#0e6f6a", color: "#ffffff" };
      const REPOS = { backgroundColor: "rgba(255, 255, 255, 0.62)", color: "#5f5a73" };

      gsap.set("#so-titre .w", { opacity: 0.25, color: "#c9c3d3" });
      gsap.set("#so-coeur", { scale: 1 });

      // Le fond clair prend le relais de la carte
      tl.fromTo("#so-scene", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 0);

      // Titre, mot à mot du gris à l'encre
      tl.to("#so-titre .w", { opacity: 1, color: "#2e2a3f", duration: 0.2, ease: "power2.out", stagger: 0.09 }, 0.25);

      // Bulle et pilules
      tl.fromTo("#so-bulle", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.15);
      tl.fromTo("#so-temps", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.3);

      // Respiration carrée, quatre temps égaux. beat-grid: 23.46 / 24.28 / 25.11 / 25.92 / 26.73 s (film)
      const T = [0.53, 1.35, 2.18, 2.99, 3.8];
      // Inspire
      tl.to("#so-p1", { ...ACTIF, duration: 0.2, ease: "power2.out" }, T[0]);
      tl.to("#so-coeur", { scale: 1.6, duration: 0.82, ease: "sine.inOut" }, T[0]);
      // Garde
      tl.to("#so-p1", { ...REPOS, duration: 0.2, ease: "power2.out" }, T[1]);
      tl.to("#so-p2", { ...ACTIF, duration: 0.2, ease: "power2.out" }, T[1]);
      // Souffle
      tl.to("#so-p2", { ...REPOS, duration: 0.2, ease: "power2.out" }, T[2]);
      tl.to("#so-p3", { ...ACTIF, duration: 0.2, ease: "power2.out" }, T[2]);
      tl.to("#so-coeur", { scale: 1, duration: 0.81, ease: "sine.inOut" }, T[2]);
      // Pause
      tl.to("#so-p3", { ...REPOS, duration: 0.2, ease: "power2.out" }, T[3]);
      tl.to("#so-p4", { ...ACTIF, duration: 0.2, ease: "power2.out" }, T[3]);
      // Nouveau cycle
      tl.to("#so-p4", { ...REPOS, duration: 0.2, ease: "power2.out" }, T[4]);
      tl.to("#so-p1", { ...ACTIF, duration: 0.2, ease: "power2.out" }, T[4]);
      tl.to("#so-coeur", { scale: 1.45, duration: 0.95, ease: "sine.inOut" }, T[4]);

      // Halo qui respire légèrement avec la musique
      for (let i = 0; i < RMS.length; i++) {
        tl.set("#so-halo-glow", { opacity: Math.min(1, 0.3 + RMS[i] * 0.8), scale: 1 + RMS[i] * 0.05 }, (i * 2) / 30);
      }

      window.__timelines["souffle"] = tl;
    })();
  </script>
